# Blueprint do Render para o TerraPorto (piloto real).
# Cria o site (Django + gunicorn), um disco para documentos e fotos enviados
# e um banco PostgreSQL. As três variáveis CENTRAL_* são pedidas na criação.
# Custo aproximado: US$ 7 (site) + US$ 6 (banco) + armazenamento ≈ US$ 15/mês.
services:
  - type: web
    name: terraporto
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    rootDir: terraporto
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py criar_central
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /saude/
    disk:
      name: arquivos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terraporto-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/arquivos
      - key: CENTRAL_USUARIO
        sync: false
      - key: CENTRAL_EMAIL
        sync: false
      - key: CENTRAL_SENHA
        sync: false

databases:
  - name: terraporto-db
    databaseName: terraporto
    user: terraporto
    plan: 0.1c-256mb
    diskSizeGB: 5
    region: virginia
    # Lista vazia bloqueia acesso pela internet; o site conecta pela rede interna do Render.
    ipAllowList: []
